<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Photography portfolio" />
    <title>Photo Port</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Manrope:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/client/src/styles/main.css" />
  </head>
  <body>
    <div id="marquee" aria-hidden="true"><div class="marquee-track"></div></div>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="grain" aria-hidden="true"></div>
    <div id="intro-title" aria-hidden="true"></div>

    <div id="preloader" role="status" aria-label="Loading gallery">
      <div class="preloader-inner">
        <div class="preloader-title" data-site-title>PHOTO&nbsp;PORT</div>
        <div class="preloader-track"><div class="preloader-bar"></div></div>
        <div class="preloader-count">00</div>
      </div>
    </div>

    <header id="site-header">
      <a class="brand" href="/" data-site-title>PHOTO PORT</a>
      <nav class="site-nav" aria-label="Main">
        <button class="nav-link" id="nav-collections" type="button">
          <span class="nav-index">01</span>Collections
        </button>
        <button class="nav-link" id="nav-about" type="button">
          <span class="nav-index">02</span>About
        </button>
      </nav>
    </header>

    <div id="hero">
      <h1 class="hero-name"></h1>
      <p class="hero-tag"></p>
    </div>

    <div id="caption" aria-live="polite">
      <div class="caption-folder"></div>
      <div class="caption-title"></div>
      <div class="caption-index"></div>
    </div>

    <div id="hint"><span></span>Scroll&nbsp;·&nbsp;Drag&nbsp;·&nbsp;Click</div>
    <a id="admin-link" href="/admin">Admin</a>
    <div id="progress" aria-hidden="true"><span></span></div>

    <section id="collections-overlay" class="overlay" hidden>
      <img class="overlay-preview" alt="" aria-hidden="true" />
      <div class="overlay-head">
        <span class="overlay-label">Collections</span>
        <button class="overlay-close" type="button" aria-label="Close collections">Close</button>
      </div>
      <ul class="collections-list"></ul>
    </section>

    <section id="about-overlay" class="overlay" hidden>
      <div class="overlay-head">
        <span class="overlay-label">About</span>
        <button class="overlay-close" type="button" aria-label="Close about">Close</button>
      </div>
      <div class="about-body">
        <h2 class="about-name"></h2>
        <p class="about-text"></p>
        <div class="about-links"></div>
      </div>
    </section>

    <section id="detail-overlay" hidden>
      <div class="detail-backdrop"></div>
      <img class="detail-img" alt="" draggable="false" />
      <div class="detail-ui">
        <button class="detail-close" type="button" aria-label="Close photo">Close</button>
        <div class="detail-meta">
          <div class="detail-folder"></div>
          <h2 class="detail-title"></h2>
        </div>
        <div class="detail-nav">
          <button class="detail-prev" type="button" aria-label="Previous photo">Prev</button>
          <span class="detail-index"></span>
          <button class="detail-next" type="button" aria-label="Next photo">Next</button>
        </div>
      </div>
    </section>

    <div id="empty-state" hidden>
      <p class="empty-kicker">The gallery is empty</p>
      <h1>Nothing here yet.</h1>
      <p>Sign in to the <a href="/admin">admin dashboard</a> and upload your first photographs.</p>
    </div>

    <div id="cursor" aria-hidden="true">
      <div class="cursor-dot"></div>
      <div class="cursor-ring"><span class="cursor-label">View</span></div>
    </div>

    <script type="module" src="/client/src/main.js"></script>
  </body>
</html>
